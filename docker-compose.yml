volumes:
  product_data:
  account_data:

services:
  product-service:          # PocketBase #1: koleksi products
    build: ./pocketbase
    restart: unless-stopped
    environment:
      POCKETBASE_SCHEMA: product_collections
      PB_SUPERUSER_EMAIL: ${PRODUCT_SUPERUSER_EMAIL:?Set PRODUCT_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${PRODUCT_SUPERUSER_PASSWORD:?Set PRODUCT_SUPERUSER_PASSWORD in .env}
    volumes:
      - product_data:/pb_data
      - ./pb_schema:/pb_schema:ro
    ports:
      - "8091:8090"         # dashboard: http://IP_SERVER:8091/_/

  account-service:          # PocketBase #2: users + favorites
    build: ./pocketbase
    restart: unless-stopped
    environment:
      POCKETBASE_SCHEMA: account_collections
      PB_SUPERUSER_EMAIL: ${ACCOUNT_SUPERUSER_EMAIL:?Set ACCOUNT_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${ACCOUNT_SUPERUSER_PASSWORD:?Set ACCOUNT_SUPERUSER_PASSWORD in .env}
    volumes:
      - account_data:/pb_data
      - ./pb_schema:/pb_schema:ro
    ports:
      - "8092:8090"         # dashboard: http://IP_SERVER:8092/_/

  gateway:                  # satu pintu masuk API
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "18081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - account-service

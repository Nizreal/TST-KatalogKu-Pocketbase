# API Gateway: satu pintu masuk untuk semua service
server {
  listen 80;
  client_max_body_size 5m;
  resolver 127.0.0.11 ipv6=off valid=10s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location = /api/health {
    default_type application/json;
    return 200 '{"gateway":"ok"}';
  }

  # product-service (PocketBase #1): koleksi products
  location = /api/products {
    set $product_service product-service:8090;
    proxy_pass http://$product_service/api/collections/products/records$is_args$args;
  }
  location /api/products/ {
    set $product_service product-service:8090;
    rewrite ^/api/products/(.*)$ /api/collections/products/records/$1 break;
    proxy_pass http://$product_service;
  }

  # account-service (PocketBase #2): akun & favorit
  location /api/auth/ {
    set $account_service account-service:8090;
    rewrite ^/api/auth/(.*)$ /api/collections/users/$1 break;
    proxy_pass http://$account_service;
  }
  location = /api/favorites {
    set $account_service account-service:8090;
    proxy_pass http://$account_service/api/collections/favorites/records$is_args$args;
  }
  location /api/favorites/ {
    set $account_service account-service:8090;
    rewrite ^/api/favorites/(.*)$ /api/collections/favorites/records/$1 break;
    proxy_pass http://$account_service;
  }
}
